services:
  web-go:
    build:
      context: .
      dockerfile: Dockerfile.go
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LISTEN_ADDR=:8000
      - REDIS_ADDR=redis-wiki-to-pdf:6379
      - REDIS_DB=0
      - CORS_ALLOWED_ORIGINS=*
      - REQUEST_BODY_LIMIT_BYTES=104857600
      - HTTP_READ_TIMEOUT=2m
      - HTTP_WRITE_TIMEOUT=6m
      - TOOL_TIMEOUT=5m
      - LUA_FILTER_PATH=/app/ImageLuaFilter.lua
      - BASE_TEMPLATE_PATH=/app/latex_templates/base.tex
      - ASSETS_TEMPLATE_DIR=/app/latex_templates/template_images
      - ERT_WIKI_ROOT=/app/ert_wiki
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./ert_wiki:/app/ert_wiki
      - ./app/latex_templates:/app/latex_templates:ro
      - ./ImageLuaFilter.lua:/app/ImageLuaFilter.lua:ro

  redis:
    image: "redis:7-alpine"
    container_name: redis-wiki-to-pdf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  redis_data: