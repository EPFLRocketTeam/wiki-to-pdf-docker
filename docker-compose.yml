services:
  web-go:
    build:
      context: .
      dockerfile: Dockerfile.go
    ports:
      - "8000:8000"
    environment:
      - LISTEN_ADDR=:8000
      - REDIS_ADDR=redis-wiki-to-pdf:6379
      - REDIS_DB=0
      - CORS_ALLOWED_ORIGINS=*
      - TOOL_TIMEOUT=120s
      - LUA_FILTER_PATH=/app/ImageLuaFilter.lua
      - BASE_TEMPLATE_PATH=/app/latex_templates/base.tex
      - ASSETS_TEMPLATE_DIR=/app/latex_templates/template_images
      - ERT_WIKI_ROOT=/app/ert_wiki
      - LOG_LEVEL=info
    restart: unless-stopped
    volumes:
      - ./ert_wiki:/app/ert_wiki
      - ./app/latex_templates:/app/latex_templates:ro
      - ./ImageLuaFilter.lua:/app/ImageLuaFilter.lua:ro

  redis:
    image: "redis:7-alpine"
    container_name: redis-wiki-to-pdf
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  redis_data: